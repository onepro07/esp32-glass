<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>灯光控制 · ESP32</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}

:root{
  --led:#3ea6ff;
  --card:rgba(255,255,255,.85);
  --card-brd:rgba(255,255,255,.90);
  --hi:rgba(255,255,255,.98);
  --sheen:rgba(255,255,255,.50);
  --ink:#14161c;
  --ink2:rgba(24,28,40,.70);
  --ink3:rgba(24,28,40,.42);
  --fill:rgba(255,255,255,.62);
  --fill-brd:rgba(255,255,255,.85);
  --seg:rgba(120,125,140,.13);
  --seg-on:#fff;
  --seg-ink:#14161c;
  --track:rgba(120,125,140,.20);
  --ring:rgba(20,23,34,.45);
  --shadow:0 26px 60px -22px rgba(6,10,30,.62),0 2px 10px rgba(6,10,30,.14);
  --r:26px;
  --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme="dark"]{
  --card:rgba(20,24,38,.68);
  --card-brd:rgba(255,255,255,.16);
  --hi:rgba(255,255,255,.28);
  --sheen:rgba(255,255,255,.13);
  --ink:#fff;
  --ink2:rgba(255,255,255,.72);
  --ink3:rgba(255,255,255,.42);
  --fill:rgba(255,255,255,.08);
  --fill-brd:rgba(255,255,255,.12);
  --seg:rgba(255,255,255,.09);
  --seg-on:rgba(255,255,255,.92);
  --seg-ink:#0b1020;
  --track:rgba(255,255,255,.15);
  --ring:rgba(255,255,255,.85);
  --shadow:0 26px 60px -22px rgba(0,0,0,.75),0 2px 10px rgba(0,0,0,.32);
}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:#0b1020;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1;
  transition:color .45s var(--ease);
}

/* ───────── 背景 ───────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(145% 62% at 16% -12%,rgba(30,56,168,.92) 0%,transparent 56%),
  radial-gradient(96% 52% at 96% 4%,rgba(132,18,62,.86) 0%,transparent 58%),
  radial-gradient(118% 62% at 44% 112%,rgba(158,84,20,.80) 0%,transparent 62%),
  linear-gradient(180deg,#060911 0%,#0a0c19 46%,#0f0a12 100%);}
.bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 88% at 50% 42%,transparent 40%,rgba(4,7,16,.55) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(96px);opacity:.30;will-change:transform}
.b1{width:58vmax;height:58vmax;left:-20vmax;top:-16vmax;background:#2b52ff;animation:d1 27s var(--ease) infinite alternate}
.b2{width:48vmax;height:48vmax;right:-18vmax;top:8vmax;background:#ff2d70;animation:d2 32s var(--ease) infinite alternate}
.b3{width:62vmax;height:62vmax;left:-12vmax;bottom:-26vmax;background:#ff8a1f;animation:d3 37s var(--ease) infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-7vmax,11vmax) scale(1.1)}}
@keyframes d3{to{transform:translate(11vmax,-8vmax) scale(1.08)}}

/* ───────── 布局 ───────── */
.app{position:relative;z-index:1;width:100%;max-width:440px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 26px);
  display:flex;flex-direction:column;gap:13px}

.top{display:flex;align-items:center;gap:10px;padding:6px 4px 10px}
.brand{flex:1;min-width:0}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-.2px;line-height:1.15;color:#fff;
  text-shadow:0 1px 12px rgba(0,0,0,.35)}
.brand p{font-size:11px;color:rgba(255,255,255,.52);letter-spacing:1.1px;margin-top:4px;text-transform:uppercase}

.iconbtn{width:38px;height:38px;border-radius:50%;border:.5px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.12);color:#fff;font-size:16px;line-height:1;cursor:pointer;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  display:flex;align-items:center;justify-content:center;
  transition:transform .26s var(--ease),background .25s}
.iconbtn:active{transform:scale(.9)}

.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:99px;font-size:12.5px;
  color:#fff;background:rgba(255,255,255,.13);border:.5px solid rgba(255,255,255,.24);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  cursor:pointer;transition:transform .26s var(--ease),background .25s;max-width:150px}
.chip:active{transform:scale(.95)}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led);
  transition:background .3s,box-shadow .3s}
.dot.idle{background:rgba(255,255,255,.45);box-shadow:none}
.dot.err{background:#ff453a;box-shadow:0 0 8px #ff453a;animation:blink 1.2s steps(2) infinite}

/* ───────── 玻璃砖 ───────── */
.glass{position:relative;border-radius:var(--r);background:var(--card);
  border:1px solid var(--card-brd);
  -webkit-backdrop-filter:blur(52px) saturate(190%);backdrop-filter:blur(52px) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  overflow:hidden;transition:background .45s var(--ease),border-color .45s var(--ease)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(135% 62% at 6% -16%,var(--sheen),transparent 58%)}
.glass::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);opacity:.8}

.card{padding:17px 17px 19px}
.card>*{position:relative;z-index:1}

.h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.h h2{font-size:12.5px;font-weight:600;letter-spacing:.5px;color:var(--ink2)}
.h .meta{font-size:11.5px;color:var(--ink3);letter-spacing:.3px}

/* 主控 */
.state{display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-radius:17px;background:var(--fill);
  border:1px solid var(--fill-brd);margin-bottom:18px}
.state .k{font-size:14px;color:var(--ink2);letter-spacing:.2px}
.state .v{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:600;letter-spacing:.2px}
.orb{position:relative;width:15px;height:15px;border-radius:50%;background:rgba(120,125,140,.30);
  transition:background .34s,box-shadow .34s}
.orb.on{background:var(--led);box-shadow:0 0 14px var(--led)}
.orb.on::after{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 26px 6px color-mix(in srgb,var(--led) 45%,transparent)}
.orb i{position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 1px 2px rgba(255,255,255,.85),inset 0 -1px 3px rgba(0,0,0,.28)}

.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.lbl span:first-child{font-size:13.5px;color:var(--ink2)}
.lbl span:last-child{font-size:12.5px;color:var(--ink3)}
.lbl b{color:var(--ink);font-weight:600;font-size:14px}

/* 滑块 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:9px;border-radius:99px;
  background:var(--track);outline:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#fff,#f4f6fa 60%,#e2e7ef);
  box-shadow:0 3px 11px rgba(0,0,0,.34),0 1px 2px rgba(0,0,0,.22);
  transition:transform .18s var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.13)}
input[type=range]::-moz-range-thumb{width:27px;height:27px;border:none;border-radius:50%;background:#fff;
  box-shadow:0 3px 11px rgba(0,0,0,.34)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{position:relative;border:none;border-radius:16px;padding:14px 8px;font-size:15px;font-weight:600;
  font-family:inherit;color:#fff;letter-spacing:.3px;cursor:pointer;
  transition:transform .26s var(--ease),filter .2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 7px 18px -8px rgba(0,0,0,.55)}
.btn:active{transform:scale(.966);filter:brightness(1.08)}
.btn.on{background:linear-gradient(180deg,#3ddc70,#28b74a)}
.btn.off{background:linear-gradient(180deg,#ff6b60,#d92d22)}
.btn.ghost{background:var(--fill);color:var(--ink);border:1px solid var(--fill-brd);
  font-weight:500;font-size:14px;box-shadow:inset 0 1px 0 var(--hi)}

/* 灯阵 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.px{position:relative;aspect-ratio:1;border-radius:15px;cursor:pointer;
  background:var(--fill);border:1px solid var(--fill-brd);
  box-shadow:inset 0 1px 0 var(--hi);
  transition:transform .26s var(--ease),background .3s,box-shadow .3s,border-color .3s;
  display:flex;align-items:center;justify-content:center;
  font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.px:active{transform:scale(.9)}
.px.lit{background:var(--c);border-color:transparent;color:rgba(255,255,255,.85);
  box-shadow:0 0 22px -2px var(--c),0 4px 16px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.5)}
.px.sel{outline:2.5px solid var(--ring);outline-offset:2px}

[data-fx="呼吸"] .px.lit{animation:breathe 2.4s ease-in-out infinite}
[data-fx="闪烁"] .px.lit{animation:flash 1s steps(1) infinite}
[data-fx="彩虹"] .px.lit{animation:hue 6s linear infinite}
[data-fx="流水"] .px.lit{animation:flow 1.8s ease-in-out infinite}
[data-fx="爆闪"] .px.lit{animation:burst 1.4s ease-out infinite}
@keyframes breathe{0%,100%{opacity:.22}50%{opacity:1}}
@keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.05}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes flow{0%,100%{opacity:.14}50%{opacity:1}}
@keyframes burst{0%,100%{opacity:.08}6%{opacity:1}12%{opacity:.18}18%{opacity:1}32%{opacity:.12}}
@keyframes blink{50%{opacity:.25}}

.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:14px;padding:4px;
  background:var(--seg);border-radius:14px}
.pill{padding:9px 6px;border-radius:10px;font-size:13px;font-family:inherit;
  color:var(--ink2);background:transparent;border:none;cursor:pointer;
  transition:all .26s var(--ease);white-space:nowrap;text-align:center}
.pill:active{transform:scale(.95)}
.pill[aria-selected="true"]{background:var(--seg-on);color:var(--seg-ink);font-weight:600;
  box-shadow:0 2px 8px rgba(0,0,0,.16)}

/* 颜色 */
.colorhead{display:flex;align-items:center;gap:13px}
.swatch{flex:1;height:52px;border-radius:16px;position:relative;overflow:hidden;
  background:var(--led);box-shadow:0 10px 24px -10px var(--led),inset 0 1px 0 rgba(255,255,255,.5);
  transition:background .35s,box-shadow .35s}
.swatch::after{content:"";position:absolute;inset:0;
  background:linear-gradient(158deg,rgba(255,255,255,.45),transparent 48%)}
.hex{font-size:12.5px;color:var(--ink2);letter-spacing:.7px;font-variant-numeric:tabular-nums;
  text-transform:uppercase;min-width:76px;text-align:right}
input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;cursor:pointer;padding:0}

.presets{display:flex;gap:9px;margin-top:15px}
.p{flex:1;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;position:relative;
  transition:transform .26s var(--ease),box-shadow .3s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px -5px rgba(0,0,0,.55)}
.p:active{transform:scale(.86)}
.p[aria-pressed="true"]{box-shadow:0 0 0 2.5px #fff,0 0 0 4px rgba(0,0,0,.10),0 4px 16px -4px currentColor}

/* 设置面板 */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;transition:opacity .3s}
.sheet.open{display:flex;opacity:1}
.panel{width:100%;max-width:440px;border-radius:28px 28px 0 0;padding:9px 20px 26px;
  background:rgba(30,34,46,.90);border-top:.5px solid rgba(255,255,255,.20);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  color:#fff;transform:translateY(100%);transition:transform .42s var(--ease)}
.sheet.open .panel{transform:translateY(0)}
.handle{width:36px;height:5px;border-radius:99px;background:rgba(255,255,255,.28);margin:0 auto 16px}
.panel h3{font-size:16px;font-weight:600;margin-bottom:5px}
.panel p{font-size:12.5px;color:rgba(255,255,255,.45);line-height:1.55;margin-bottom:16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:rgba(255,255,255,.62);margin-bottom:7px;letter-spacing:.4px}
.field input[type=text]{width:100%;padding:13px 15px;border-radius:13px;font-size:15px;font-family:inherit;
  color:#fff;background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.16);outline:none}
.field input[type=text]:focus{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.13)}
.seg{display:flex;gap:5px;padding:4px;border-radius:13px;background:rgba(255,255,255,.08)}
.seg button{flex:1;padding:10px;border:none;border-radius:10px;font-size:13.5px;font-family:inherit;
  color:rgba(255,255,255,.66);background:transparent;cursor:pointer;transition:all .25s var(--ease)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.92);color:#0b1020;font-weight:600}
.panel .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:.5px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,18px);
  z-index:30;padding:11px 19px;border-radius:99px;font-size:13px;white-space:nowrap;
  background:rgba(28,32,44,.90);border:.5px solid rgba(255,255,255,.16);color:#fff;
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  opacity:0;pointer-events:none;transition:opacity .28s,transform .34s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<main class="app">

  <header class="top">
    <div class="brand">
      <h1>灯光控制</h1>
      <p>ESP32 · PWM &amp; WS2812</p>
    </div>
    <button class="iconbtn" id="theme" aria-label="切换深浅色">◐</button>
    <button class="chip" id="chip" aria-label="设备连接设置">
      <span class="dot idle" id="chipDot"></span>
      <span id="chipText">演示</span>
    </button>
  </header>

  <!-- 主控 -->
  <section class="glass card">
    <div class="h">
      <h2>主控</h2>
      <span class="meta" id="chLabel">CH1 · GPIO 4</span>
    </div>

    <div class="state">
      <span class="k">灯光状态</span>
      <span class="v">
        <i class="orb" id="orb"><i></i></i>
        <span id="stateText">已关闭</span>
      </span>
    </div>

    <div class="lbl">
      <span>亮度</span>
      <span><b id="brightVal">0</b> / 255</span>
    </div>
    <input type="range" id="bright" min="0" max="255" value="0" aria-label="亮度调节">

    <div class="actions">
      <button class="btn on" id="allOn">全开 255</button>
      <button class="btn off" id="allOff">关闭 0</button>
    </div>
  </section>

  <!-- 灯阵 -->
  <section class="glass card">
    <div class="h">
      <h2>灯阵</h2>
      <span class="meta">4 × 4 · 16 灯</span>
    </div>

    <div class="grid" id="grid" data-fx="常亮"></div>

    <div class="fx" id="fx" role="tablist" aria-label="灯效">
      <button class="pill" role="tab" aria-selected="true" data-fx="常亮">常亮</button>
      <button class="pill" role="tab" aria-selected="false" data-fx="呼吸">呼吸</button>
      <button class="pill" role="tab" aria-selected="false" data-fx="闪烁">闪烁</button>
      <button class="pill" role="tab" aria-selected="false" data-fx="彩虹">彩虹</button>
      <button class="pill" role="tab" aria-selected="false" data-fx="流水">流水</button>
      <button class="pill" role="tab" aria-selected="false" data-fx="爆闪">爆闪</button>
    </div>

    <div class="actions" style="margin-top:12px">
      <button class="btn ghost" id="mtxOn">全部点亮</button>
      <button class="btn ghost" id="mtxOff">全部熄灭</button>
    </div>
  </section>

  <!-- 颜色 -->
  <section class="glass card">
    <div class="h">
      <h2>颜色</h2>
      <span class="meta" id="colorScope">全局</span>
    </div>

    <div class="colorhead">
      <div class="swatch" id="swatch">
        <input type="color" id="picker" value="#3ea6ff" aria-label="选择颜色">
      </div>
      <span class="hex" id="hex">#3EA6FF</span>
    </div>

    <div class="presets" id="presets"></div>
  </section>

</main>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="handle"></div>
    <h3>设备连接</h3>
    <p>演示模式下所有操作只在本页生效。<br>切到实时模式后，指令会以 JSON 发往设备。</p>

    <div class="field">
      <label>设备地址</label>
      <input type="text" id="ipInput" placeholder="192.168.4.1" inputmode="url" autocomplete="off">
    </div>

    <div class="field">
      <label>运行模式</label>
      <div class="seg" id="modeSeg">
        <button data-mode="demo" aria-pressed="true">演示</button>
        <button data-mode="live" aria-pressed="false">实时</button>
      </div>
    </div>

    <button class="btn ghost" id="closeSheet" style="width:100%;margin-top:4px">完成</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const state = {
    on: false, brightness: 0, color: '#3ea6ff', effect: '常亮',
    pixels: new Array(16).fill(false), selected: -1,
    mode: 'demo', ip: '192.168.4.1', theme: 'light',
  };
  const PRESETS = ['#ff3b30', '#ff9f0a', '#ffd60a', '#30d158', '#40e0d0', '#3ea6ff', '#bf5af2'];
  const $ = (s) => document.querySelector(s);
  const el = {
    grid: $('#grid'), fx: $('#fx'), bright: $('#bright'), brightVal: $('#brightVal'),
    orb: $('#orb'), stateText: $('#stateText'), swatch: $('#swatch'), hex: $('#hex'),
    picker: $('#picker'), presets: $('#presets'), chip: $('#chip'), chipText: $('#chipText'),
    chipDot: $('#chipDot'), sheet: $('#sheet'), ipInput: $('#ipInput'), modeSeg: $('#modeSeg'),
    toast: $('#toast'), colorScope: $('#colorScope'), theme: $('#theme'),
  };

  let toastTimer;
  const toast = (m) => {
    el.toast.textContent = m; el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1700);
  };

  /* ── 通信层 ──────────────────────────────
     实时模式约定，可按固件调整：
       POST /api/led     {on, brightness}
       POST /api/color   {hex}
       POST /api/effect  {name}
       POST /api/matrix  {index|all, on, hex}
  ───────────────────────────────────────── */
  const API = {
    base() {
      return 'http://' + state.ip.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
    },
    async send(path, body) {
      if (state.mode === 'demo') return true;
      try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 4000);
        const r = await fetch(this.base() + path, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body), signal: c.signal,
        });
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        el.chipDot.classList.remove('err');
        return true;
      } catch (e) {
        el.chipDot.classList.add('err');
        toast('设备无响应 · ' + (e.name === 'AbortError' ? '超时' : e.message));
        return false;
      }
    },
  };

  /* ── 渲染 ────────────────────────────── */
  function applyAccent(hex) {
    document.documentElement.style.setProperty('--led', hex);
    el.swatch.style.background = hex;
    el.hex.textContent = hex.toUpperCase();
    el.picker.value = hex;
    paintTrack();
  }

  function paintTrack() {
    const p = (state.brightness / 255) * 100;
    el.bright.style.background =
      `linear-gradient(90deg,${state.color} 0%,${state.color} ${p}%,var(--track) ${p}%,var(--track) 100%)`;
  }

  function renderMaster() {
    const on = state.on && state.brightness > 0;
    el.orb.classList.toggle('on', on);
    el.stateText.textContent = on ? '已点亮' : '已关闭';
    el.brightVal.textContent = state.brightness;
    el.bright.value = state.brightness;
    applyAccent(state.color);
  }

  function buildGrid() {
    el.grid.innerHTML = '';
    state.pixels.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'px';
      b.setAttribute('aria-label', `第 ${i + 1} 颗灯`);
      b.textContent = i + 1;
      b.addEventListener('click', () => togglePixel(i));
      el.grid.appendChild(b);
    });
    paintGrid();
  }

  function paintGrid() {
    [...el.grid.children].forEach((d, i) => {
      d.classList.toggle('lit', state.pixels[i]);
      d.classList.toggle('sel', state.selected === i);
      d.style.setProperty('--c', state.color);
    });
    el.colorScope.textContent = state.selected >= 0 ? `第 ${state.selected + 1} 颗` : '全局';
  }

  const rgbToHex = (s) => {
    const m = s.match(/\d+/g);
    return m ? '#' + m.slice(0, 3).map((n) => (+n).toString(16).padStart(2, '0')).join('') : s;
  };

  function buildPresets() {
    el.presets.innerHTML = '';
    PRESETS.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'p';
      b.style.background = c;
      b.style.color = c;
      b.setAttribute('aria-label', '预设色 ' + c);
      b.addEventListener('click', () => setColor(c));
      el.presets.appendChild(b);
    });
  }

  function markPreset() {
    [...el.presets.children].forEach((b) => {
      const on = rgbToHex(b.style.background) === state.color.toLowerCase();
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ── 交互 ────────────────────────────── */
  function togglePixel(i) {
    state.selected = state.selected === i ? -1 : i;
    state.pixels[i] = !state.pixels[i];
    paintGrid();
    API.send('/api/matrix', { index: i, on: state.pixels[i], hex: state.color });
  }

  function setColor(hex) {
    state.color = hex.toLowerCase();
    if (state.selected >= 0) {
      state.pixels[state.selected] = true;
      API.send('/api/matrix', { index: state.selected, on: true, hex: state.color });
    } else {
      API.send('/api/color', { hex: state.color });
    }
    renderMaster(); paintGrid(); markPreset();
  }

  el.bright.addEventListener('input', (e) => {
    state.brightness = +e.target.value;
    state.on = state.brightness > 0;
    renderMaster();
    API.send('/api/led', { on: state.on, brightness: state.brightness });
  });

  $('#allOn').addEventListener('click', () => {
    state.on = true; state.brightness = 255; renderMaster();
    API.send('/api/led', { on: true, brightness: 255 }); toast('已全开');
  });

  $('#allOff').addEventListener('click', () => {
    state.on = false; state.brightness = 0; renderMaster();
    API.send('/api/led', { on: false, brightness: 0 }); toast('已关闭');
  });

  $('#mtxOn').addEventListener('click', () => {
    state.pixels = new Array(16).fill(true); state.selected = -1;
    paintGrid(); API.send('/api/matrix', { all: true, on: true, hex: state.color });
  });

  $('#mtxOff').addEventListener('click', () => {
    state.pixels = new Array(16).fill(false); state.selected = -1;
    paintGrid(); API.send('/api/matrix', { all: true, on: false, hex: state.color });
  });

  el.fx.addEventListener('click', (e) => {
    const b = e.target.closest('.pill'); if (!b) return;
    state.effect = b.dataset.fx;
    [...el.fx.children].forEach((x) => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
    el.grid.dataset.fx = state.effect;
    API.send('/api/effect', { name: state.effect });
  });

  el.picker.addEventListener('input', (e) => setColor(e.target.value));

  /* 主题 */
  function setTheme(t) {
    state.theme = t;
    document.documentElement.dataset.theme = t;
    el.theme.textContent = t === 'light' ? '◐' : '◑';
    localStorage.setItem('esp32.theme', t);
  }
  el.theme.addEventListener('click', () => setTheme(state.theme === 'light' ? 'dark' : 'light'));

  /* 设置面板 */
  const openSheet = () => {
    el.ipInput.value = state.ip;
    [...el.modeSeg.children].forEach((b) =>
      b.setAttribute('aria-pressed', b.dataset.mode === state.mode ? 'true' : 'false'));
    el.sheet.classList.add('open');
  };
  const closeSheet = () => el.sheet.classList.remove('open');

  el.chip.addEventListener('click', openSheet);
  $('#closeSheet').addEventListener('click', closeSheet);
  el.sheet.addEventListener('click', (e) => { if (e.target === el.sheet) closeSheet(); });

  el.modeSeg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]'); if (!b) return;
    state.mode = b.dataset.mode;
    [...el.modeSeg.children].forEach((x) =>
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    updateChip(); localStorage.setItem('esp32.mode', state.mode);
    toast(state.mode === 'live' ? '已切到实时模式' : '已切到演示模式');
  });

  el.ipInput.addEventListener('change', () => {
    state.ip = el.ipInput.value.trim() || '192.168.4.1';
    localStorage.setItem('esp32.ip', state.ip);
    updateChip();
  });

  function updateChip() {
    el.chipText.textContent = state.mode === 'demo' ? '演示' : state.ip;
    el.chipDot.classList.toggle('idle', state.mode === 'demo');
  }

  /* ── 启动 ────────────────────────────── */
  const savedIp = localStorage.getItem('esp32.ip');
  const savedMode = localStorage.getItem('esp32.mode');
  const savedTheme = localStorage.getItem('esp32.theme');
  if (savedIp) state.ip = savedIp;
  if (savedMode) state.mode = savedMode;
  setTheme(savedTheme || 'light');

  buildGrid(); buildPresets(); renderMaster(); markPreset(); updateChip();
})();
</script>
</body>
</html>
